name: Build AyuGram .deb (cached)

on:
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-22.04
    timeout-minutes: 1440
    permissions:
      contents: write

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      # ------------------------------------------------------------
      # Sync upstream AyuGram
      # ------------------------------------------------------------
      - name: Sync upstream AyuGram
        run: |
          git remote add upstream https://github.com/AyuGram/AyuGramDesktop.git || true
          git fetch upstream --tags
          git checkout dev
          git reset --hard upstream/dev

      # ------------------------------------------------------------
      # Fix & update submodules (robust)
      # ------------------------------------------------------------
      - name: Fix submodules
        run: |
          set -e
          git submodule init

          git config submodule.Telegram/lib_ui.url https://github.com/desktop-app/lib_ui.git
          git config submodule.Telegram/ThirdParty/tgcalls.url https://github.com/TelegramMessenger/tgcalls.git
          git config submodule.codegen.url https://github.com/AyuGram/codegen.git
          git config submodule.cmake.url https://github.com/telegramdesktop/cmake_helpers.git

          git submodule sync --recursive

          if git submodule update --init --recursive; then
            echo "Submodules updated normally"
          else
            echo "Retry submodules with fallback..."
            git submodule foreach --recursive '
              git fetch origin || true
              git checkout origin/HEAD || git checkout main || git checkout master || true
            '
            git submodule update --init --force --recursive
          fi

      # ------------------------------------------------------------
      # Get version
      # ------------------------------------------------------------
      - name: Get version
        run: |
          TAG=$(git describe --tags --abbrev=0)
          VERSION=${TAG#v}
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "UPSTREAM_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV

      # ------------------------------------------------------------
      # Cache build output (out/)
      # ------------------------------------------------------------
      - name: Cache build output
        uses: actions/cache@v4
        with:
          path: out
          key: ayugram-out-${{ runner.os }}-${{ env.VERSION }}
          restore-keys: |
            ayugram-out-${{ runner.os }}-

      # ------------------------------------------------------------
      # Cache ccache
      # ------------------------------------------------------------
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ env.VERSION }}
          restore-keys: |
            ccache-${{ runner.os }}-

      # ------------------------------------------------------------
      # Install packaging tools
      # ------------------------------------------------------------
      - name: Install packaging tools
        run: |
          sudo apt update
          sudo apt install -y fakeroot dpkg-dev

      # ------------------------------------------------------------
      # Build AyuGram (Docker + ccache)
      # ------------------------------------------------------------
      - name: Build AyuGram binary
        run: |
          docker run --rm \
            -u root \
            -e CCACHE_DIR=/usr/src/tdesktop/.ccache \
            -v "$PWD:/usr/src/tdesktop" \
            ghcr.io/telegramdesktop/tdesktop/centos_env:latest \
            bash -c "
              mkdir -p out .ccache &&
              ccache -M 10G || true &&
              export PATH=/usr/lib64/ccache:\$PATH &&
              /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
                -D TDESKTOP_API_ID=2040 \
                -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627
            "

      # ------------------------------------------------------------
      # Fix permission after Docker
      # ------------------------------------------------------------
      - name: Fix permissions
        run: |
          sudo chown -R $USER:$USER .

      # ------------------------------------------------------------
      # Prepare Debian package
      # ------------------------------------------------------------
      - name: Prepare .deb structure
        run: |
          PKG=ayugram_${VERSION}_amd64

          mkdir -p $PKG/DEBIAN
          mkdir -p $PKG/usr/bin
          mkdir -p $PKG/usr/share/applications
          mkdir -p $PKG/usr/share/icons/hicolor/256x256/apps

          cp out/Release/AyuGram $PKG/usr/bin/ayugram
          chmod 755 $PKG/usr/bin/ayugram

          cat > $PKG/usr/share/applications/ayugram.desktop <<EOF
          [Desktop Entry]
          Name=AyuGram
          Comment=Telegram Desktop client
          Exec=ayugram
          Icon=ayugram
          Terminal=false
          Type=Application
          Categories=Network;InstantMessaging;
          StartupWMClass=AyuGram
          EOF

          cp Telegram/Resources/art/icon256.png \
             $PKG/usr/share/icons/hicolor/256x256/apps/ayugram.png

          cat > $PKG/DEBIAN/control <<EOF
          Package: ayugram
          Version: ${VERSION}
          Section: net
          Priority: optional
          Architecture: amd64
          Depends: libc6, libstdc++6, libgcc-s1, libglib2.0-0, libx11-6, libxcb1, libxrender1, libxkbcommon0, libdbus-1-3
          Maintainer: AyuGram
          Description: AyuGram Desktop
           AyuGram is a custom Telegram Desktop client.
          EOF

      # ------------------------------------------------------------
      # Build .deb
      # ------------------------------------------------------------
      - name: Build .deb
        run: |
          fakeroot dpkg-deb --build ayugram_${VERSION}_amd64
          ls -lh *.deb

      # ------------------------------------------------------------
      # Release
      # ------------------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: deb-${{ env.TAG }}
          name: AyuGram ${{ env.VERSION }} (.deb)
          body: |
            AyuGram Debian package
            Version: ${{ env.VERSION }}
            Commit: ${{ env.UPSTREAM_COMMIT }}
          files: ayugram_${{ env.VERSION }}_amd64.deb
