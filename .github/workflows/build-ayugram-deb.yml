name: Build AyuGram .deb (Debian / Linux Mint)

on:
  workflow_dispatch:

jobs:
  build-deb:
    name: Build AyuGram DEB
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    timeout-minutes: 1440

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with upstream AyuGram
        run: |
          git remote add upstream https://github.com/AyuGram/AyuGramDesktop.git || true
          git fetch upstream --tags
          git checkout dev
          git reset --hard upstream/dev

      - name: Robust submodule fix & update
        run: |
          set -e

          echo "Initializing submodules"
          git submodule init

          echo "Fix submodule URLs (known broken refs)"
          git config submodule.Telegram/lib_ui.url https://github.com/desktop-app/lib_ui.git
          git config submodule.Telegram/ThirdParty/tgcalls.url https://github.com/TelegramMessenger/tgcalls.git
          git config submodule.codegen.url https://github.com/AyuGram/codegen.git
          git config submodule.cmake.url https://github.com/telegramdesktop/cmake_helpers.git

          git submodule sync --recursive

          echo "Try normal update"
          if git submodule update --init --recursive; then
            echo "Submodules updated normally"
          else
            echo "Fallback: checkout default branches"
            git submodule foreach --recursive '
              git fetch origin || true
              git checkout origin/HEAD || git checkout main || git checkout master || true
            '
            git submodule update --init --force --recursive
          fi

      - name: Get version from tag
        run: |
          TAG=$(git describe --tags --abbrev=0)
          VERSION=${TAG#v}
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "UPSTREAM_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Install host dependencies
        run: |
          sudo apt update
          sudo apt install -y docker.io fakeroot dpkg-dev

      - name: Build AyuGram binary (CentOS Docker)
        run: |
          docker run --rm \
            -v "$PWD:/usr/src/tdesktop" \
            ghcr.io/telegramdesktop/tdesktop/centos_env:latest \
            bash -c "
              /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
                -D TDESKTOP_API_ID=2040 \
                -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627
            "

      - name: Prepare Debian package structure
        run: |
          PKG=ayugram_${VERSION}_amd64

          mkdir -p $PKG/DEBIAN
          mkdir -p $PKG/usr/bin
          mkdir -p $PKG/usr/share/applications
          mkdir -p $PKG/usr/share/icons/hicolor/256x256/apps

          # Binary
          cp out/Release/AyuGram $PKG/usr/bin/ayugram
          chmod 755 $PKG/usr/bin/ayugram

          # Desktop entry
          cat > $PKG/usr/share/applications/ayugram.desktop <<EOF
          [Desktop Entry]
          Name=AyuGram
          Comment=Telegram Desktop client
          Exec=ayugram
          Icon=ayugram
          Terminal=false
          Type=Application
          Categories=Network;InstantMessaging;
          StartupWMClass=AyuGram
          EOF

          # Icon
          cp Telegram/Resources/art/icon256.png \
             $PKG/usr/share/icons/hicolor/256x256/apps/ayugram.png

          # Control file
          cat > $PKG/DEBIAN/control <<EOF
          Package: ayugram
          Version: ${VERSION}
          Section: net
          Priority: optional
          Architecture: amd64
          Depends: libc6, libstdc++6, libgcc-s1, libglib2.0-0, libx11-6, libxcb1, libxrender1, libxkbcommon0, libdbus-1-3
          Maintainer: AyuGram
          Description: AyuGram Desktop
           AyuGram is a custom Telegram Desktop client.
          EOF

      - name:
