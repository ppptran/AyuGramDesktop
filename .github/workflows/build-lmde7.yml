name: Build AyuGram LMDE 7

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Giải phóng dung lượng runner
      - name: Free Disk Space (Maximize)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # 2. Checkout source AyuGram
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # 3. Build trong Docker Debian (gần LMDE 7 nhất)
      - name: Build AyuGram in Docker (Debian)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/sources \
            -w /sources \
            debian:trixie \
            bash -c "
              set -eux

              echo '== Update system =='
              apt-get update

              echo '== Install build dependencies =='
              apt-get install -y \
                build-essential cmake ninja-build git pkg-config \
                qt6-base-dev qt6-base-private-dev \
                libqt6svg6-dev qt6-image-formats-plugins \
                libavcodec-dev libavformat-dev libswscale-dev \
                libopus-dev libssl-dev \
                libx11-xcb-dev libx11-dev libxcb-keysyms1-dev \
                libpulse-dev libasound2-dev \
                libva-dev libvdpau-dev libdrm-dev \
                libhunspell-dev liblzma-dev libenchant-2-dev \
                libwayland-dev libxxhash-dev \
                libabsl-dev libfmt-dev libexpected-dev \
                libpipewire-0.3-dev libxtst-dev libxext-dev \
                libgoogle-perftools-dev \
                libminizip-dev libproxy-dev \
                libcrypto++-dev libicu-dev

              echo '== Configure project =='
              mkdir -p build
              cd build

              cmake -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DTDESKTOP_API_ID=173491 \
              -DTDESKTOP_API_HASH=344583b45741c457fe1862106095a5eb \
              -Dtg_voip_use_system_lib=OFF \
              -Drnnoise_use_system_lib=OFF \
              -DDESKTOP_APP_USE_PACKAGED=ON \
              -DDESKTOP_APP_DISABLE_WAYLAND_INTEGRATION=OFF \
              

                ..

              echo '== Build =='
              ninja

              echo '== Verify output =='
              ls -l build/Telegram

              if [ ! -f build/Telegram/Telegram ]; then
                echo '❌ Binary build/Telegram/Telegram not found'
                exit 1
              fi

              echo '== Prepare artifact =='
              mkdir -p /sources/artifact
              cp build/Telegram/Telegram /sources/artifact/AyuGram
              chmod +x /sources/artifact/AyuGram
            "

      # 4. Upload binary
      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-LMDE7
          path: artifact/AyuGram
