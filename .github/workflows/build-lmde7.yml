name: Build AyuGram LMDE 7

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Free disk space
      - name: Free Disk Space (Maximize)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # 2. Checkout source
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # 3. Build AyuGram inside Docker (Debian)
      - name: Build AyuGram in Docker (Debian)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/sources \
            -w /sources \
            debian:trixie \
            bash -c "
              set -eux

              echo '== Update system =='
              apt-get update

              echo '== Install dependencies =='
              apt-get install -y \
                build-essential cmake ninja-build git pkg-config \
                qt6-base-dev qt6-base-private-dev \
                libqt6svg6-dev qt6-image-formats-plugins \
                libavcodec-dev libavformat-dev libswscale-dev \
                libopus-dev libssl-dev \
                libx11-xcb-dev libx11-dev libxcb-keysyms1-dev \
                libpulse-dev libasound2-dev \
                libva-dev libvdpau-dev libdrm-dev \
                libhunspell-dev liblzma-dev libenchant-2-dev \
                libwayland-dev libxxhash-dev \
                libabsl-dev libfmt-dev libexpected-dev \
                libpipewire-0.3-dev libxtst-dev libxext-dev \
                libgoogle-perftools-dev \
                libminizip-dev libproxy-dev \
                libcrypto++-dev libicu-dev

              echo '== Fix git safe.directory =='
              git config --global --add safe.directory /sources

              echo '== Init submodules =='
              git submodule update --init --recursive
