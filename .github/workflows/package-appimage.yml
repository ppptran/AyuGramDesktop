name: Package AyuGram AppImage (from cache)

on:
  workflow_dispatch:

jobs:
  appimage:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
    # --------------------------------------------------
    # Checkout (chỉ để lấy icon, desktop file nếu cần)
    # --------------------------------------------------
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # --------------------------------------------------
    # Lấy version (PHẢI trùng workflow build .deb)
    # --------------------------------------------------
    - name: Get version
      run: |
        TAG=$(git describe --tags --abbrev=0)
        VERSION=${TAG#v}
        echo "TAG=$TAG" >> $GITHUB_ENV
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV

    # --------------------------------------------------
    # Restore cache binary đã build
    # --------------------------------------------------
    - name: Restore AyuGram build cache
      uses: actions/cache@v4
      with:
        path: out
        key: ayugram-out-${{ runner.os }}-${{ env.VERSION }}
        restore-keys: |
          ayugram-out-${{ runner.os }}-

    # --------------------------------------------------
    # Verify binary tồn tại
    # --------------------------------------------------
    - name: Verify binary
      run: |
        if [ ! -f out/Release/AyuGram ]; then
          echo "::error::Binary out/Release/AyuGram not found. Cache miss."
          exit 1
        fi
        chmod +x out/Release/AyuGram

    # --------------------------------------------------
    # Build AppImage (KHÔNG build lại)
    # --------------------------------------------------
    - name: Build AppImage
      run: |
        sudo apt update
        sudo apt install -y wget fuse

        wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
        chmod +x appimagetool-x86_64.AppImage

        # AppDir layout
        mkdir -p AppDir/usr/bin \
                 AppDir/usr/share/applications \
                 AppDir/usr/share/icons/hicolor/256x256/apps

        # Binary
        cp out/Release/AyuGram AppDir/usr/bin/ayugram
        chmod +x AppDir/usr/bin/ayugram

        # Icon
        cp Telegram/Resources/art/icon256.png \
           AppDir/usr/share/icons/hicolor/256x256/apps/ayugram.png

        # Desktop file MUST be at AppDir root
        cat > AppDir/ayugram.desktop <<EOF
        [Desktop Entry]
        Name=AyuGram
        Exec=ayugram
        Icon=ayugram
        Type=Application
        Categories=Network;InstantMessaging;
        StartupWMClass=AyuGram
        EOF

        # Copy desktop file to standard location too
        cp AppDir/ayugram.desktop AppDir/usr/share/applications/

        # AppRun
        cat > AppDir/AppRun <<'EOF'
        #!/bin/sh
        HERE="$(dirname "$(readlink -f "$0")")"
        exec "$HERE/usr/bin/ayugram" "$@"
        EOF
        chmod +x AppDir/AppRun

        # Build AppImage
        ./appimagetool-x86_64.AppImage AppDir AyuGram-${VERSION}-x86_64.AppImage

    # --------------------------------------------------
    # GitHub Release
    # --------------------------------------------------
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: appimage-${{ env.TAG }}
        name: AyuGram ${{ env.VERSION }} AppImage
        body: |
          AyuGram AppImage
          Commit: ${{ env.COMMIT }}
        files: AyuGram-${{ env.VERSION }}-x86_64.AppImage
